[project]
name = "go-phonmatchnet-export"
version = "0.1.0"
description = "Convert naptrap's PyTorch PhonMatchNet models to the ONNX graphs go-phonmatchnet embeds"
requires-python = "==3.12.*"
dependencies = [
    "naptrap==0.1.0",
    "numpy==2.2.6",
    "onnx==1.17.0",
    "onnxruntime==1.22.1",
    "safetensors==0.5.3",
    "torch==2.6.0+cpu",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
